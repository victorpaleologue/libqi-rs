[package]
name = "libqi"
description = "The qi framework of NAOqi robots (libqi, qimessaging) in Rust: sessions, services, objects, signals and properties, byte-compatible with the C++ implementation"

edition.workspace = true
license-file.workspace = true
authors.workspace = true
version.workspace = true
rust-version.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# The package is `libqi` on crates.io (`qi` is taken); the library is used as `qi`.
name = "qi"

[dependencies]
async-trait = { workspace = true }
derive_more = { workspace = true }
bytes = { workspace = true }
either = { workspace = true }
futures = { workspace = true }
once_cell = { workspace = true }
pin-project-lite = { workspace = true }
qi-format = { workspace = true }
qi-macros = { workspace = true }
qi-messaging = { workspace = true }
qi-value = { workspace = true }
sealed = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
ouroboros = "0.18.5"

[dev-dependencies]
assert_matches = { workspace = true }
serde_with = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }
