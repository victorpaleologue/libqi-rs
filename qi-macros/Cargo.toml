[package]
name = "qi-macros"
description = "Procedural macros of the qi framework: #[qi::object] and the value derives"

edition.workspace = true
license-file.workspace = true
authors.workspace = true
version.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
quote = "1.0.42"
syn = { workspace = true }
proc-macro2 = "1.0.103"
convert_case = "0.10.0"

[dev-dependencies]
assert_matches = { workspace = true }
syn = { workspace = true }
pretty_assertions = { workspace = true }
qi-macros = { path = "../qi-macros" }  # path only: dropped on publish, avoids a dev-dependency cycle
qi-value = { path = "../qi-value" }  # path only: dropped on publish, avoids a dev-dependency cycle
